<template>

    <lightning-card title="My Expenses">

        <div class="slds-p-around_medium">

            <div class="slds-p-bottom_medium">

                <lightning-button
                    label="New Expense"
                    variant="brand"
                    onclick={handleNewExpense}>
                </lightning-button>

            </div>

            <lightning-datatable
                key-field="Id"
                data={expenses}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>

        </div>

    </lightning-card>


    <template if:true={isNewExpenseModalOpen}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="expense-modal-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">

                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={handleCloseModal}>
                    </lightning-button-icon>

                    <h2
                        id="expense-modal-heading"
                        class="slds-text-heading_medium">

                        New Expense

                    </h2>

                </header>


                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-combobox
                        name="expenseType"
                        label="Expense Type"
                        value={expenseType}
                        options={expenseTypeOptions}
                        onchange={handleInputChange}
                        required>
                    </lightning-combobox>


                    <lightning-input
                        type="number"
                        name="amount"
                        label="Amount"
                        value={amount}
                        min="0.01"
                        step="0.01"
                        onchange={handleInputChange}
                        required>
                    </lightning-input>


                    <lightning-input
                        type="date"
                        name="expenseDate"
                        label="Expense Date"
                        value={expenseDate}
                        onchange={handleInputChange}
                        required>
                    </lightning-input>


                    <lightning-textarea
                        name="description"
                        label="Description"
                        value={description}
                        onchange={handleInputChange}>
                    </lightning-textarea>


                    <div class="slds-m-top_medium slds-text-align_right">

                        <lightning-button
                            label="Cancel"
                            onclick={handleCloseModal}>
                        </lightning-button>

                        <lightning-button
                            class="slds-m-left_small"
                            label="Save as Draft"
                            variant="brand"
                            onclick={handleSaveExpense}>
                        </lightning-button>

                    </div>

                </div>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>
