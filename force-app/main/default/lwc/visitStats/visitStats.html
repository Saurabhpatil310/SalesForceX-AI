<template>

    <lightning-layout multiple-rows>

        <lightning-layout-item size="3">

            <lightning-card title="Planned">

                <div class="count">

                    {planned}

                </div>

            </lightning-card>

        </lightning-layout-item>

        <lightning-layout-item size="3">

            <lightning-card title="In Progress">

                <div class="count">

                    {inProgress}

                </div>

            </lightning-card>

        </lightning-layout-item>

        <lightning-layout-item size="3">

            <lightning-card title="Completed">

                <div class="count">

                    {completed}

                </div>

            </lightning-card>

        </lightning-layout-item>

        <lightning-layout-item size="3">

            <lightning-card title="Missed">

                <div class="count">

                    {missed}

                </div>

            </lightning-card>

        </lightning-layout-item>

    </lightning-layout>

</template>
